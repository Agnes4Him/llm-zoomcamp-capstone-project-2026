apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: healthsecure-api-route

spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api

      backendRefs:
        - name: healthsecure-api
          port: 5000