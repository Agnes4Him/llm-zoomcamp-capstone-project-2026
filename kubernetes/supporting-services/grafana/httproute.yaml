apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: grafana-route
  namespace: monitoring

spec:
  parentRefs:
    - name: api-gateway
      namespace: traefik

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: grafana
          port: 3000